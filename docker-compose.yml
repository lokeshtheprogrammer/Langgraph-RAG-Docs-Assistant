version: '3.8'

services:
  rag-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-assistant-server
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories to persist vector index and SQLite database on host
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    environment:
      - SQLITE_DB_PATH=/app/data/app.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
    restart: always
